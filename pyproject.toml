[project]
name = "fraudetection"
version = "0.1.0"
description = "Comparación reproducible de clasificadores para detectar fraude en tarjetas de crédito"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14,<1",
    "joblib>=1.3,<2",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pandas>=2.3,<4",
    "python-pptx>=1.0.2,<2",
    "scikit-learn>=1.7,<2",
    "threadpoolctl>=3.2,<4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
fraudetection = "fraudetection.reproduction.cli:main"
fraudetection-inspect = "fraudetection.cli:main"
fraudetection-run = "fraudetection.experiments:main"
fraudetection-report = "fraudetection.presentation:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.17.0",
]
