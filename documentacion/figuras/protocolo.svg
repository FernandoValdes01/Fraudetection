  <text x="64" y="655" font-size="14" font-weight="700" fill="#1F2A37" text-anchor="start">Controles contra fuga de información</text>
  <text x="64" y="683" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">Duplicados eliminados antes de partir   ·   Escalado, selección de variables y submuestreo ajustados dentro de cada pliegue   ·   Test fuera de la búsqueda</text>
