  <text x="92" y="508" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Selección</text>
  <text x="64" y="537" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Máxima sensibilidad media</text>
  <text x="64" y="559" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Desempate por precisión</text>
  <text x="64" y="581" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Ganador: Random Forest, 1:10</text>
  <rect x="440" y="475" width="320" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="440" y="485" width="4" height="98" rx="2" fill="#2E6F9E"/>
  <circle cx="468" cy="503" r="13" fill="#2E6F9E"/>
  <text x="468" y="508" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="492" y="508" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Reajuste final</text>
  <text x="464" y="537" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Entrenamiento completo</text>
  <text x="464" y="559" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">5 semillas: 42, 101, 202,</text>
  <text x="464" y="581" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">303 y 404</text>
  <rect x="820" y="475" width="320" height="118" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/>
  <rect x="820" y="485" width="4" height="98" rx="2" fill="#B45309"/>
  <circle cx="848" cy="503" r="13" fill="#B45309"/>
  <text x="848" y="508" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="872" y="508" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Evaluación en test</text>
  <text x="844" y="537" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">85.118 filas, 142 fraudes</text>
  <text x="844" y="559" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Prevalencia original intacta</text>
  <text x="844" y="581" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Sin reuso para ajustar</text>
