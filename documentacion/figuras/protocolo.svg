  <text x="844" y="352" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">198.608 filas</text>
  <text x="844" y="374" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">331 fraudes</text>
  <text x="844" y="396" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Única fuente de toda decisión</text>
  <rect x="440" y="290" width="320" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="440" y="300" width="4" height="98" rx="2" fill="#2E6F9E"/>
  <circle cx="468" cy="318" r="13" fill="#2E6F9E"/>
  <text x="468" y="323" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="492" y="323" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Muestra de búsqueda</text>
  <text x="464" y="352" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">50.000 filas del entrenamiento</text>
  <text x="464" y="374" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">83 fraudes</text>
  <text x="464" y="396" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Acota el costo de la rejilla</text>
  <rect x="40" y="290" width="320" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="40" y="300" width="4" height="98" rx="2" fill="#2E6F9E"/>
  <circle cx="68" cy="318" r="13" fill="#2E6F9E"/>
  <text x="68" y="323" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="92" y="323" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Validación cruzada</text>
  <text x="64" y="352" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">5 pliegues estratificados</text>
  <text x="64" y="374" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">8 experimentos: 4 modelos</text>
  <text x="64" y="396" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">con y sin submuestreo 1:10</text>
  <rect x="40" y="475" width="320" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="40" y="485" width="4" height="98" rx="2" fill="#2E6F9E"/>
  <circle cx="68" cy="503" r="13" fill="#2E6F9E"/>
