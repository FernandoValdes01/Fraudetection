<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 730" width="1230" height="730" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Protocolo experimental</title>
  <desc>Siete etapas: limpieza, partición 70/30, muestra de búsqueda, validación cruzada de cinco pliegues, selección, reajuste con cinco semillas y evaluación en el test reservado.</desc>
  <defs><marker id="head-2E6F9E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E6F9E"/></marker><marker id="head-B45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker><marker id="head-64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs>
  <rect width="1230" height="730" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1F2A37" text-anchor="start">Protocolo experimental</text>
  <text x="40" y="72" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">El test reservado queda fuera de la búsqueda y se evalúa al fijar la configuración.</text>
  <rect x="40" y="105" width="320" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="40" y="115" width="4" height="98" rx="2" fill="#2E6F9E"/>
  <text x="64" y="138" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Dataset original</text>
  <text x="64" y="167" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">284.807 transacciones</text>
  <text x="64" y="189" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">492 fraudes (0,173 %)</text>
  <text x="64" y="211" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">30 predictores, sin faltantes</text>
  <rect x="440" y="105" width="320" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="440" y="115" width="4" height="98" rx="2" fill="#2E6F9E"/>
  <circle cx="468" cy="133" r="13" fill="#2E6F9E"/>
  <text x="468" y="138" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="492" y="138" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Limpieza</text>
  <text x="464" y="167" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">1.081 duplicados exactos eliminados</text>
  <text x="464" y="189" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">283.726 transacciones</text>
  <text x="464" y="211" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">473 fraudes (0,167 %)</text>
  <rect x="820" y="105" width="320" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="820" y="115" width="4" height="98" rx="2" fill="#2E6F9E"/>
  <circle cx="848" cy="133" r="13" fill="#2E6F9E"/>
  <text x="848" y="138" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="872" y="138" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Partición 70/30</text>
  <text x="844" y="167" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Estratificada, semilla 42</text>
  <text x="844" y="189" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Se aplica antes de cualquier</text>
  <text x="844" y="211" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">ajuste o selección</text>
  <rect x="820" y="290" width="320" height="118" rx="10" fill="#E6F0F8" stroke="#2E6F9E" stroke-width="1.5"/>
  <rect x="820" y="300" width="4" height="98" rx="2" fill="#2E6F9E"/>
