<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Random Forest propio</title>
  <desc>El conjunto de entrenamiento genera T muestras bootstrap; cada una entrena un árbol de decisión con características aleatorias por división. El voto mayoritario decide, con empate a favor del fraude.</desc>
  <defs><marker id="head-2E6F9E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E6F9E"/></marker><marker id="head-B45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker><marker id="head-64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1F2A37" text-anchor="start">Random Forest implementado en el proyecto</text>
  <text x="40" y="72" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">Bootstrap, características aleatorias por división y voto mayoritario. Sin RandomForestClassifier ni BaggingClassifier.</text>
  <rect x="40" y="130" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="40" y="140" width="4" height="130" rx="2" fill="#2E6F9E"/>
  <text x="64" y="163" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">Entrenamiento</text>
  <text x="64" y="192" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">n filas, p variables</text>
  <text x="64" y="214" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">Clases 0 y 1</text>
  <path d="M264 205 L296 205" fill="none" stroke="#64748B" stroke-width="2" />
  <path d="M296 153 L296 393" fill="none" stroke="#64748B" stroke-width="2" />
  <path d="M296 153 L326 153" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#head-64748B)"/>
  <path d="M296 273 L326 273" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#head-64748B)"/>
  <path d="M296 393 L326 393" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#head-64748B)"/>
  <rect x="330" y="118" width="190" height="70" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="345" y="144" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">Bootstrap 1</text>
  <text x="345" y="166" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">n filas con reemplazo</text>
  <path d="M524 153 L590 153" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#head-64748B)"/>
  <rect x="594" y="118" width="220" height="70" rx="8" fill="#E6F0F8" stroke="#2E6F9E" stroke-width="1.5"/>
  <text x="609" y="144" font-size="14" font-weight="600" fill="#2E6F9E" text-anchor="start">Árbol 1</text>
  <text x="609" y="166" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">√p variables por división</text>
  <path d="M818 153 L934 153" fill="none" stroke="#2E6F9E" stroke-width="2" marker-end="url(#head-2E6F9E)"/>
  <text x="876" y="145" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">voto</text>
  <rect x="330" y="238" width="190" height="70" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="345" y="264" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">Bootstrap 2</text>
  <text x="345" y="286" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">n filas con reemplazo</text>
  <path d="M524 273 L590 273" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#head-64748B)"/>
  <rect x="594" y="238" width="220" height="70" rx="8" fill="#E6F0F8" stroke="#2E6F9E" stroke-width="1.5"/>
  <text x="609" y="264" font-size="14" font-weight="600" fill="#2E6F9E" text-anchor="start">Árbol 2</text>
  <text x="609" y="286" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">√p variables por división</text>
  <path d="M818 273 L934 273" fill="none" stroke="#2E6F9E" stroke-width="2" marker-end="url(#head-2E6F9E)"/>
  <text x="876" y="265" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">voto</text>
  <text x="560" y="342" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">⋮</text>
  <rect x="330" y="358" width="190" height="70" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="345" y="384" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">Bootstrap T</text>
  <text x="345" y="406" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">n filas con reemplazo</text>
  <path d="M524 393 L590 393" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#head-64748B)"/>
  <rect x="594" y="358" width="220" height="70" rx="8" fill="#E6F0F8" stroke="#2E6F9E" stroke-width="1.5"/>
  <text x="609" y="384" font-size="14" font-weight="600" fill="#2E6F9E" text-anchor="start">Árbol T</text>
  <text x="609" y="406" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">√p variables por división</text>
  <path d="M818 393 L934 393" fill="none" stroke="#2E6F9E" stroke-width="2" marker-end="url(#head-2E6F9E)"/>
  <text x="876" y="385" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">voto</text>
  <rect x="940" y="130" width="220" height="310" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/>
  <text x="1050" y="168" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">Voto mayoritario</text>
  <text x="1050" y="204" font-size="13.5" font-weight="400" fill="#1F2A37" text-anchor="middle">fraude si</text>
  <text x="1050" y="228" font-size="15" font-weight="700" fill="#1F2A37" text-anchor="middle">votos ≥ T / 2</text>
  <text x="1050" y="268" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">El empate se resuelve</text>
  <text x="1050" y="288" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">a favor del fraude</text>
  <text x="1050" y="340" font-size="12.5" font-weight="600" fill="#1F2A37" text-anchor="middle">Configuración elegida</text>
  <text x="1050" y="362" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">T = 21 árboles</text>
  <text x="1050" y="384" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">profundidad máxima 6</text>
  <text x="1050" y="406" font-size="13" font-weight="400" fill="#64748B" text-anchor="middle">submuestreo 1:10</text>
  <rect x="40" y="330" width="220" height="110" rx="10" fill="#F1F5F9" stroke="#F1F5F9" stroke-width="1.5"/>
  <text x="58" y="360" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="start">Cada árbol es</text>
  <text x="58" y="382" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">DecisionTreeClassifier,</text>
  <text x="58" y="402" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">con semilla propia y única</text>
  <text x="58" y="422" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">por árbol.</text>
</svg>
